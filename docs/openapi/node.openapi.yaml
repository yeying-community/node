openapi: 3.1.0
info:
  title: YeYing Node API
  version: 1.0.0
  license:
    name: ISC
    identifier: ISC
  description: YeYing 社区 Node 枢纽服务接口，覆盖身份授权、应用中心、审核、MPC 协调、钱包托管、通知、AppStore Registry 和 release artifact。
servers:
  - url: https://node.yeying.pub
    description: Community production node
tags:
  - name: Health
    description: 服务可用性检查。
  - name: Auth
    description: SIWE、JWT 和中心化 UCAN。
  - name: Identity
    description: 钱包身份 DID、账户关联、邮箱/用户名凭证、身份级 Passkey/TOTP 认证器和授权码登录。
  - name: Profile
    description: 当前认证身份信息。
  - name: Applications
    description: 应用元数据、配置、搜索和发布状态。
  - name: Audits
    description: 应用审核申请和审批。
  - name: MPC
    description: 多方计算会话、消息和事件流。
  - name: Custody
    description: 钱包客户端加密密钥托管。
  - name: Notifications
    description: 通知收件箱、事件流和 Webhook。
  - name: Publisher
    description: 应用发布包提交、审核和 release artifact 管理。
  - name: Admin
    description: 管理员治理接口。
paths:
  /api/v1/public/health:
    get:
      tags:
        - Health
      summary: 健康检查
      operationId: get_api_v1_public_health
      security: []
      parameters: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
