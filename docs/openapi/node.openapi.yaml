components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or UCAN
      description: SIWE JWT、钱包签发 UCAN 或中心化签发 UCAN。
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    Envelope:
      type: object
      required:
        - code
        - message
        - data
        - timestamp
      properties:
        code:
          type: integer
          examples:
            - 0
        message:
          type: string
          examples:
            - ok
        data: {}
        timestamp:
          type: integer
          format: int64
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            code:
              type: integer
              minimum: 400
            data:
              type:
                - object
                - "null"
    SignedActionFields:
      type: object
      required:
        - requestId
        - timestamp
        - signature
      properties:
        requestId:
          type: string
          description: 幂等请求 ID / 签名 nonce。
        timestamp:
          oneOf:
            - type: integer
            - type: string
        signature:
          type: string
          description: 钱包 personal_sign 签名。
    AuthChallengeRequest:
      type: object
      required:
        - address
      properties:
        address:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        scope:
          type: array
          items:
            type: string
          description: 可选钱包身份 scope。
    AuthVerifyRequest:
      type: object
      required:
        - address
        - signature
      properties:
        address:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        signature:
          type: string
    IdentityDid:
      type: string
      pattern: ^did:yeying:wid_[A-Za-z0-9_-]{22,}$
    IdentityAccount:
      type: object
      required:
        - chainKey
        - address
      properties:
        chainKey:
          type: string
          examples:
            - eip155:1
        address:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
    IdentityAccountLinkChallengeRequest:
      type: object
      required:
        - identity
        - account
      properties:
        identity:
          $ref: "#/components/schemas/IdentityDid"
        account:
          $ref: "#/components/schemas/IdentityAccount"
    IdentityAccountLinkVerifyRequest:
      type: object
      required:
        - identity
        - identityDocument
        - account
        - nonce
        - issuedAt
        - expiresAt
        - accountSignature
      properties:
        identity:
          $ref: "#/components/schemas/IdentityDid"
        identityDocument:
          type: object
          additionalProperties: true
        account:
          $ref: "#/components/schemas/IdentityAccount"
        nonce:
          type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        accountSignature:
          type: string
          description: 账户钱包对账户关联 message 的签名。
    IdentityVerificationRequest:
      type: object
      required:
        - identity
        - account
        - email
        - types
      properties:
        identity:
          $ref: "#/components/schemas/IdentityDid"
        account:
          $ref: "#/components/schemas/IdentityAccount"
        email:
          type: string
          format: email
        username:
          type: string
          minLength: 3
          maxLength: 32
        type:
          type: string
          enum:
            - email
            - username
        types:
          type: array
          items:
            type: string
            enum:
              - email
              - username
    IdentityVerificationConfirmRequest:
      type: object
      required:
        - verificationId
        - code
        - types
      properties:
        verificationId:
          type: string
        code:
          type: string
        codes:
          type: object
          additionalProperties:
            type: string
        type:
          type: string
          enum:
            - email
            - username
        types:
          type: array
          items:
            type: string
            enum:
              - email
              - username
    IdentityCredentialsStatusRequest:
      type: object
      required:
        - credentials
      properties:
        issuer:
          type: string
        credentials:
          type: array
          minItems: 1
          items:
            type: string
    IdentityCredentialReissueChallengeRequest:
      type: object
      required:
        - identity
        - credentialTypes
      properties:
        identity:
          $ref: "#/components/schemas/IdentityDid"
        credentialTypes:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - EmailCredential
              - UsernameCredential
    IdentityCredentialReissueConfirmRequest:
      type: object
      required:
        - identity
        - challengeId
        - identityDocument
        - proof
      properties:
        identity:
          $ref: "#/components/schemas/IdentityDid"
        challengeId:
          type: string
        identityDocument:
          type: object
          additionalProperties: true
        proof:
          type: object
          additionalProperties: true
    IdentityPasskeyRegisterRequest:
      type: object
      required:
        - identity
        - identityDocument
      properties:
        identity:
          $ref: "#/components/schemas/IdentityDid"
        identityDocument:
          type: object
          additionalProperties: true
        deviceName:
          type: string
    IdentityPasskeyRegisterConfirmRequest:
      type: object
      required:
        - identity
        - requestId
        - credential
      properties:
        identity:
          $ref: "#/components/schemas/IdentityDid"
        requestId:
          type: string
          description: 注册挑战 requestId。
        deviceName:
          type: string
        credential:
          type: object
          additionalProperties: true
    IdentityPasskeyListRequest:
      type: object
      required:
        - identity
      properties:
        identity:
          $ref: "#/components/schemas/IdentityDid"
    IdentityPasskeyRevokeRequest:
      type: object
      required:
        - identity
        - identityDocument
        - credentialId
      properties:
        identity:
          $ref: "#/components/schemas/IdentityDid"
        identityDocument:
          type: object
          additionalProperties: true
        credentialId:
          type: string
    IdentityTotpGetRequest:
      type: object
      required:
        - identity
      properties:
        identity:
          $ref: "#/components/schemas/IdentityDid"
    IdentityTotpSetupRequest:
      type: object
      required:
        - identity
        - identityDocument
      properties:
        identity:
          $ref: "#/components/schemas/IdentityDid"
        identityDocument:
          type: object
          additionalProperties: true
        deviceName:
          type: string
          description: 用户可识别的 TOTP 认证器名称。
    IdentityTotpConfirmRequest:
      type: object
      required:
        - identity
        - code
      properties:
        identity:
          $ref: "#/components/schemas/IdentityDid"
        code:
          type: string
          minLength: 6
          maxLength: 16
    IdentityTotpRevokeRequest:
      type: object
      required:
        - identity
        - identityDocument
      properties:
        identity:
          $ref: "#/components/schemas/IdentityDid"
        identityDocument:
          type: object
          additionalProperties: true
    IdentityAuthorizeRequest:
      type: object
      required:
        - appId
        - redirectUri
        - codeChallenge
      properties:
        appId:
          type: string
        redirectUri:
          type: string
          format: uri
        state:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
              - identity.basic
              - identity.wallet
              - identity.username
              - identity.email
        scope:
          type: array
          items:
            type: string
            enum:
              - identity.basic
              - identity.wallet
              - identity.username
              - identity.email
        codeChallenge:
          type: string
          minLength: 43
          maxLength: 128
        code_challenge:
          type: string
          minLength: 43
          maxLength: 128
        codeChallengeMethod:
          type: string
          enum:
            - S256
        code_challenge_method:
          type: string
          enum:
            - S256
    IdentityAuthorizeChallengeRequest:
      type: object
      required:
        - requestId
      properties:
        requestId:
          type: string
    IdentityAuthorizeApproveRequest:
      type: object
      required:
        - requestId
      properties:
        requestId:
          type: string
        presentation:
          type: object
          additionalProperties: true
          description: Wallet 插件签发的钱包身份 presentation。
        passkeyRequestId:
          type: string
          description: 无 Bearer Passkey approve 时必填。
        challengeId:
          type: string
          description: passkeyRequestId 的兼容别名。
        credential:
          type: object
          additionalProperties: true
    IdentityAuthorizeExchangeRequest:
      type: object
      required:
        - code
        - appId
        - redirectUri
        - codeVerifier
      properties:
        code:
          type: string
        appId:
          type: string
        redirectUri:
          type: string
          format: uri
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
    CustodyStatus:
      type: object
      properties:
        subject:
          type: string
        passkeyBound:
          type: boolean
        passkeyCount:
          type: integer
        enabled:
          type: boolean
        recordCount:
          type: integer
        records:
          type: array
          items:
            $ref: "#/components/schemas/CustodyRecord"
    CustodyStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CustodyStatus"
    CustodyRecord:
      type: object
      required:
        - walletId
      properties:
        walletId:
          type: string
        accountId:
          type: string
        address:
          type: string
        ciphertext:
          type: string
          description: 仅详情接口返回的客户端加密密文。
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
        updatedAt:
          type: string
        lastVerifiedAt:
          type: string
    CustodyUpsertRequest:
      type: object
      required:
        - walletId
        - ciphertext
      properties:
        walletId:
          type: string
        accountId:
          type: string
        address:
          type: string
        ciphertext:
          type: string
          description: 必须在客户端完成加密。
        metadata:
          type: object
          additionalProperties: true
    MpcSessionCreateRequest:
      allOf:
        - $ref: "#/components/schemas/SignedActionFields"
        - type: object
          required:
            - type
            - walletId
            - threshold
            - participants
          properties:
            id:
              type: string
            type:
              type: string
            walletId:
              type: string
            threshold:
              type: integer
              minimum: 1
            participants:
              type: array
              items:
                type: string
            curve:
              type: string
            expiresAt:
              type: string
            keyVersion:
              type: integer
            shareVersion:
              type: integer
    MpcJoinRequest:
      allOf:
        - $ref: "#/components/schemas/SignedActionFields"
        - type: object
          required:
            - participantId
            - deviceId
            - identity
            - e2ePublicKey
          properties:
            participantId:
              type: string
            deviceId:
              type: string
            identity:
              type: string
            e2ePublicKey:
              type: string
            signingPublicKey:
              type: string
    ReleaseSubmitRequest:
      type: object
      required:
        - publisher_key_id
        - files
      properties:
        publisher_key_id:
          type: string
        files:
          type: object
          additionalProperties:
            type: string
          description: 文件路径到文本内容的映射。
  responses:
    Success:
      description: 统一成功响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Envelope"
    BadRequest:
      description: 请求参数或签名错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 缺少或无效的 JWT/UCAN/Agent token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: 角色、状态、capability 或资源权限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: 幂等冲突、状态冲突或租约冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
