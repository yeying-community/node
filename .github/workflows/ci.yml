name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: node_test
          POSTGRES_USER: node
          POSTGRES_PASSWORD: node
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U node -d node_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://node:node@127.0.0.1:5432/node_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:api-prefixes
      - run: npm run openapi:check
      - run: npm test
      - run: npm run build:all
